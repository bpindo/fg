<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Generator Ringkasan Materi SMP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
</script>

<style>
body { font-family: Arial, sans-serif; background:#f4f6fa; padding:20px; }
.container { max-width:900px; background:#fff; padding:20px; border-radius:8px; }
label { font-weight:bold; display:block; margin-top:15px; }
input, select, button, textarea {
  width:100%; padding:10px; margin-top:8px;
}
button { background:#2e7dff; color:#fff; border:none; cursor:pointer; }
textarea { height:220px; }
.note { font-size:13px; color:#555; margin-top:10px; }
</style>
</head>

<body>
<div class="container">

<h2>Generator Ringkasan Materi SMP</h2>

<label>Kelas</label>
<select id="kelas">
  <option>Kelas 7</option>
  <option>Kelas 8</option>
  <option>Kelas 9</option>
</select>

<label>Mata Pelajaran</label>
<select id="mapel">
  <option>IPA</option>
  <option>IPS</option>
  <option>Bahasa Indonesia</option>
  <option>Bahasa Inggris</option>
  <option>Matematika</option>
</select>

<label>Upload PDF Materi</label>
<input type="file" id="pdfFile" accept="application/pdf">

<button onclick="processPDF()">Ringkas Materi</button>

<label>Hasil Ringkasan</label>
<textarea id="output" placeholder="Ringkasan akan muncul di sini..."></textarea>

<p class="note">
Tool ini membantu meringkas materi pelajaran, bukan pengganti pembelajaran di sekolah.
</p>

</div>

<script>
const stopWords = ["dan","yang","di","ke","dari","adalah","ini","itu","dengan","untuk","pada"];

async function processPDF() {
  const fileInput = document.getElementById("pdfFile");
  const file = fileInput.files[0];

  if (!file) {
    alert("Silakan pilih file PDF terlebih dahulu.");
    return;
  }

  const reader = new FileReader();
  reader.readAsArrayBuffer(file);

  reader.onload = async function() {
    const pdf = await pdfjsLib.getDocument({ data: reader.result }).promise;
    let fullText = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      content.items.forEach(item => fullText += item.str + " ");
    }

    smartSummarize(fullText);
  };
}

function smartSummarize(text) {
  text = text.toLowerCase();
  let sentences = text.match(/[^.!?]+[.!?]+/g) || [];

  let freq = {};
  sentences.forEach(s => {
    s.split(" ").forEach(w => {
      w = w.replace(/[^a-z]/g,"");
      if (w.length > 3 && !stopWords.includes(w)) {
        freq[w] = (freq[w] || 0) + 1;
      }
    });
  });

  let scored = sentences.map(s => {
    let score = 0;
    s.split(" ").forEach(w => {
      w = w.replace(/[^a-z]/g,"");
      if (freq[w]) score += freq[w];
    });
    return { s, score };
  });

  scored.sort((a,b)=>b.score-a.score);
  let summary = scored.slice(0,6).map(x=>"• "+x.s.trim()).join("\n");

  document.getElementById("output").value =
`Ringkasan Materi (${mapel.value} - ${kelas.value})

${summary}

Kesimpulan:
Materi ini berisi konsep penting yang perlu dipahami siswa SMP.`;
}
</script>

</body>
</html>
