<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Generator Ringkasan Materi SMP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f6fa; padding:20px; }
.container { max-width:900px; background:#fff; padding:20px; border-radius:8px; }
h1 { font-size:22px; }
label { font-weight:bold; margin-top:15px; display:block; }
select, input, button, textarea {
  width:100%; margin-top:8px; padding:10px;
}
button { background:#2e7dff; color:#fff; border:none; cursor:pointer; }
button:hover { background:#1c5ed8; }
textarea { height:230px; }
.note { font-size:13px; color:#555; margin-top:10px; }
</style>
</head>

<body>
<div class="container">
<h1>Generator Ringkasan Materi SMP</h1>

<label>Kelas</label>
<select id="kelas">
  <option>Kelas 7</option>
  <option>Kelas 8</option>
  <option>Kelas 9</option>
</select>

<label>Mata Pelajaran</label>
<select id="mapel">
  <option>IPA</option>
  <option>IPS</option>
  <option>Bahasa Indonesia</option>
  <option>Bahasa Inggris</option>
  <option>Matematika</option>
</select>

<label>Upload PDF Materi</label>
<input type="file" id="pdfFile" accept="application/pdf">

<button onclick="processPDF()">Ringkas Materi</button>

<label>Hasil Ringkasan</label>
<textarea id="output" placeholder="Ringkasan akan muncul di sini..."></textarea>

<button onclick="copyText()">Salin Ringkasan</button>

<p class="note">
Tool ini membantu merangkum materi pelajaran untuk pemahaman belajar, bukan pengganti pembelajaran di sekolah.
</p>
</div>

<script>
const stopWords = [
  "dan","yang","di","ke","dari","adalah","ini","itu","dengan",
  "untuk","pada","sebagai","oleh","karena","atau","juga","dalam"
];

async function processPDF() {
  const file = document.getElementById("pdfFile").files[0];
  if (!file) return alert("Upload PDF terlebih dahulu.");

  const reader = new FileReader();
  reader.readAsArrayBuffer(file);

  reader.onload = async function() {
    const pdf = await pdfjsLib.getDocument({ data: reader.result }).promise;
    let text = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      content.items.forEach(item => text += item.str + " ");
    }

    smartSummarize(text);
  };
}

function smartSummarize(text) {
  text = text.toLowerCase().replace(/\s+/g," ");

  let sentences = text.match(/[^.!?]+[.!?]+/g);
  if (!sentences) return;

  let wordFreq = {};
  sentences.forEach(sentence => {
    sentence.split(" ").forEach(word => {
      word = word.replace(/[^a-zA-Z]/g,"");
      if (word.length > 3 && !stopWords.includes(word)) {
        wordFreq[word] = (wordFreq[word] || 0) + 1;
      }
    });
  });

  let sentenceScore = sentences.map(sentence => {
    let score = 0;
    sentence.split(" ").forEach(word => {
      word = word.replace(/[^a-zA-Z]/g,"");
      if (wordFreq[word]) score += wordFreq[word];
    });
    return { sentence, score };
  });

  sentenceScore.sort((a,b) => b.score - a.score);
  let summary = sentenceScore.slice(0,6)
    .map(s => "- " + s.sentence.trim())
    .join("\n");

  output.value =
`Ringkasan Materi (${mapel.value} - ${kelas.value})

${summary}

Kesimpulan:
Materi ini membahas konsep penting yang perlu dipahami siswa SMP.`;
}

function copyText() {
  output.select();
  document.execCommand("copy");
  alert("Ringkasan berhasil disalin.");
}
</script>

</body>
</html>
