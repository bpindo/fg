<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Blog Viewer</title>

<style>

body{
font-family:system-ui;
background:#f2f4f8;
margin:0;
padding:12px;
}

.container{
max-width:600px;
margin:auto;
}

h1,h2,h3{
color:#1f2937;
}

ul{
list-style:none;
padding:0;
}

li{
background:#fff;
padding:12px;
margin-bottom:8px;
border-radius:8px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
transition:.2s;
}

li:hover{
background:#2563eb;
color:#fff;
}

.comment-count{
font-size:13px;
color:#6b7280;
}

.post-card{
background:#fff;
padding:16px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
margin-bottom:16px;
}

.comment-card{
background:#f9fafb;
border-radius:10px;
padding:10px;
margin-bottom:8px;
border:1px solid #e5e7eb;
}

.comment-reply{
border-left:2px solid #e5e7eb;
margin-left:16px;
padding-left:10px;
margin-top:6px;
}

.comment-author{
font-weight:600;
color:#2563eb;
}

.comment-text{
margin-top:2px;
color:#374151;
}

button{
margin-top:12px;
padding:10px 14px;
border:none;
border-radius:8px;
background:#ef4444;
color:#fff;
cursor:pointer;
font-weight:600;
}

a{
color:#2563eb;
text-decoration:underline;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>Mini Blog</h1>

<div id="content"></div>

</div>

<script>

const GAS_URL="https://script.google.com/macros/s/AKfycbwzsIy_r8hsXjIH7nt2VgxETeM86kipahJCMPMLLAzgenyjWc-SrkxTRwI-uym1-Qws/exec";

/* BASE PATH untuk GitHub Pages */
const BASE_PATH = window.location.pathname.split("/@")[0];

let posts=[];


/* SLUG */

function slugify(text){
return text.toString().toLowerCase()
.trim()
.replace(/[\s]+/g,'-')
.replace(/[^\w\-]+/g,'');
}


/* COUNT COMMENT */

function countAllComments(comments){

let count=0;

comments.forEach(c=>{

count+=1;

if(c.replies && c.replies.length>0){
count+=countAllComments(c.replies);
}

});

return count;

}


/* RENDER COMMENTS */

function renderComments(comments){

let html="";

comments.forEach(c=>{

html+=`
<div class="comment-card">
<div class="comment-author">${c.author}</div>
<div class="comment-text">${c.text}</div>
</div>
`;

if(c.replies && c.replies.length>0){

html+=`
<div class="comment-reply">
${renderComments(c.replies)}
</div>
`;

}

});

return html;

}


/* FETCH POSTS */

async function fetchPosts(){

try{

const resp=await fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({read:true})
});

const data=await resp.json();

posts=data || [];

posts.forEach(p=>{

p.slug=slugify(p.judul);

if(!p.comments)p.comments=[];

});

render();

}

catch(e){

document.getElementById("content").innerHTML="Gagal ambil data";

}

}


/* ROUTER */

function getRoute(){

const path=window.location.pathname.replace(BASE_PATH,"");

const parts=path.split("/").filter(Boolean);

if(parts.length===0){
return {type:"home"};
}

if(parts.length===1 && parts[0].startsWith("@")){
return {
type:"author",
author:parts[0].replace("@","")
};
}

if(parts.length===2 && parts[0].startsWith("@")){
return{
type:"post",
author:parts[0].replace("@",""),
slug:parts[1]
};
}

return {type:"home"};

}


/* OPEN POST */

function openPost(author,slug){

const url=`${BASE_PATH}/@${slugify(author)}/${slug}`;

history.pushState({}, "", url);

render();

}


/* OPEN AUTHOR */

function openAuthor(author){

const url=`${BASE_PATH}/@${slugify(author)}`;

history.pushState({}, "", url);

render();

}


/* HOME */

function renderHome(){

let html="<ul>";

posts.forEach(p=>{

html+=`
<li onclick="openPost('${p.author}','${p.slug}')">
<span>${p.judul}</span>
<span class="comment-count">💬 ${countAllComments(p.comments)}</span>
</li>
`;

});

html+="</ul>";

return html;

}


/* AUTHOR */

function renderAuthor(author){

const authorPosts=posts.filter(p=>slugify(p.author)===author);

let html=`
<div class="post-card">
<h2>@${author}</h2>
</div>
<ul>
`;

authorPosts.forEach(p=>{

html+=`
<li onclick="openPost('${p.author}','${p.slug}')">
<span>${p.judul}</span>
<span class="comment-count">💬 ${countAllComments(p.comments)}</span>
</li>
`;

});

html+="</ul>";

return html;

}


/* POST */

function renderPost(author,slug){

const post=posts.find(p=>
slugify(p.author)===author && p.slug===slug
);

if(!post){
return "<p>Post tidak ditemukan</p>";
}

let html=`
<div class="post-card">

<h2>${post.judul}</h2>

<p>
Author:
<a onclick="openAuthor('${post.author}')">@${post.author}</a>
</p>

${post.ket?`<p>${post.ket}</p>`:""}

${post.link?`
<p>
<a href="${post.link}" target="_blank">Buka Link</a>
</p>
`:""}

<h3>Komentar (${countAllComments(post.comments)})</h3>

${renderComments(post.comments)}

<button onclick="goHome()">Home</button>

</div>
`;

return html;

}


/* GO HOME */

function goHome(){

history.pushState({}, "", BASE_PATH);

render();

}


/* MAIN RENDER */

function render(){

const route=getRoute();

const el=document.getElementById("content");

if(route.type==="home"){
el.innerHTML=renderHome();
}

if(route.type==="author"){
el.innerHTML=renderAuthor(route.author);
}

if(route.type==="post"){
el.innerHTML=renderPost(route.author,route.slug);
}

}


/* BACK BUTTON */

window.addEventListener("popstate",render);


/* START */

fetchPosts();

</script>

</body>
</html>
