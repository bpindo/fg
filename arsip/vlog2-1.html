<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Blog Viewer</title>

<style>

body{
font-family:system-ui;
background:#f2f4f8;
margin:0;
padding:12px;
}

.container{
max-width:640px;
margin:auto;
}

h1,h2,h3{
color:#1f2937;
}

ul{
list-style:none;
padding:0;
}

li{
background:#fff;
padding:12px;
margin-bottom:8px;
border-radius:8px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
transition:.2s;
}

li:hover{
background:#2563eb;
color:#fff;
}

.comment-count{
font-size:13px;
color:#6b7280;
}

.post-card{
background:#fff;
padding:16px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
margin-bottom:16px;
}

.comment-card{
background:#f9fafb;
border-radius:10px;
padding:10px;
margin-bottom:8px;
border:1px solid #e5e7eb;
}

.comment-reply{
border-left:2px solid #e5e7eb;
margin-left:16px;
padding-left:10px;
margin-top:6px;
}

.comment-author{
font-weight:600;
color:#2563eb;
}

.comment-text{
margin-top:2px;
color:#374151;
}

button{
margin-top:12px;
padding:10px 14px;
border:none;
border-radius:8px;
background:#ef4444;
color:#fff;
cursor:pointer;
font-weight:600;
}

.author-link{
font-weight:600;
cursor:pointer;
}

a{
color:#2563eb;
text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<h1>Mini Blog</h1>

<div id="content"></div>

</div>

<script>

const GAS_URL="https://script.google.com/macros/s/AKfycbwzsIy_r8hsXjIH7nt2VgxETeM86kipahJCMPMLLAzgenyjWc-SrkxTRwI-uym1-Qws/exec";

let posts=[];


/* SLUG */

function slugify(text){

return text
.toString()
.toLowerCase()
.trim()
.replace(/\s+/g,"-")
.replace(/[^\w\-]+/g,"");

}


/* HITUNG KOMENTAR */

function countAllComments(comments){

let count=0;

comments.forEach(c=>{

count+=1;

if(c.replies && c.replies.length>0){
count+=countAllComments(c.replies);
}

});

return count;

}


/* RENDER KOMENTAR */

function renderComments(comments){

let html="";

comments.forEach(c=>{

html+=`
<div class="comment-card">

<div class="comment-author">${c.author || "Anonymous"}</div>

<div class="comment-text">${c.text}</div>

</div>
`;

if(c.replies && c.replies.length>0){

html+=`
<div class="comment-reply">
${renderComments(c.replies)}
</div>
`;

}

});

return html;

}


/* FETCH POSTS */

async function fetchPosts(){

try{

const resp=await fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({read:true})
});

const data=await resp.json();

posts=data || [];

posts.forEach(p=>{

p.slug=slugify(p.judul || "post");

if(!p.comments) p.comments=[];

});

render();

}

catch(err){

console.error(err);

document.getElementById("content").innerHTML="Gagal ambil data";

}

}


/* ROUTER */

function getRoute(){

const hash=window.location.hash.replace("#","");

const parts=hash.split("/").filter(Boolean);

if(parts.length===0){
return {type:"home"};
}

if(parts.length===1 && parts[0].startsWith("@")){
return{
type:"author",
author:parts[0].replace("@","")
};
}

if(parts.length===2 && parts[0].startsWith("@")){
return{
type:"post",
author:parts[0].replace("@",""),
slug:parts[1]
};
}

return {type:"home"};

}


/* HOME */

function renderHome(){

let html="<ul>";

posts.forEach(p=>{

const commentCount=countAllComments(p.comments);

html+=`

<li onclick="openPost('${p.author}','${p.slug}')">

<span>${p.judul}</span>

<span class="comment-count">💬 ${commentCount}</span>

</li>

`;

});

html+="</ul>";

document.getElementById("content").innerHTML=html;

}


/* AUTHOR PAGE */

function renderAuthor(author){

const list=posts.filter(p=>slugify(p.author)===slugify(author));

let html=`<div class="post-card">

<h2>@${author}</h2>

<p>${list.length} Post</p>

</div>

<ul>`;

list.forEach(p=>{

html+=`

<li onclick="openPost('${p.author}','${p.slug}')">

<span>${p.judul}</span>

<span class="comment-count">💬 ${countAllComments(p.comments)}</span>

</li>

`;

});

html+="</ul>";

html+=`<button onclick="goHome()">Home</button>`;

document.getElementById("content").innerHTML=html;

}


/* POST PAGE */

function renderPost(author,slug){

const post=posts.find(p=>slugify(p.author)===slugify(author) && p.slug===slug);

if(!post){

document.getElementById("content").innerHTML="Post tidak ditemukan";

return;

}

let html=`

<div class="post-card">

<h2>${post.judul}</h2>

<p>${post.ket || ""}</p>

<p>
Author:
<span class="author-link" onclick="openAuthor('${post.author}')">
${post.author}
</span>
</p>

${post.link ? `<p>Link: <a href="${post.link}" target="_blank">${post.link}</a></p>`:""}

<h3>Komentar (${countAllComments(post.comments)})</h3>

${renderComments(post.comments)}

<button onclick="goHome()">Home</button>

</div>

`;

document.getElementById("content").innerHTML=html;

}


/* NAVIGATION */

function openPost(author,slug){

window.location.hash=`@${slugify(author)}/${slug}`;

}

function openAuthor(author){

window.location.hash=`@${slugify(author)}`;

}

function goHome(){

window.location.hash="";

}


/* RENDER */

function render(){

const route=getRoute();

if(route.type==="home") renderHome();

if(route.type==="author") renderAuthor(route.author);

if(route.type==="post") renderPost(route.author,route.slug);

}


window.addEventListener("hashchange",render);


/* START */

fetchPosts();

</script>

</body>
</html>
