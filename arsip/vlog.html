<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Viewer Vlog - GAS</title>
<style>
body{font-family:system-ui;margin:12px;background:#f4f4f4}
.card{background:#fff;padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:12px}
h1{font-size:18px;margin-bottom:6px}
p{font-size:14px;margin-bottom:6px}
a{color:#2563eb;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div id="postContainer"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwzsIy_r8hsXjIH7nt2VgxETeM86kipahJCMPMLLAzgenyjWc-SrkxTRwI-uym1-Qws/exec";

const params = new URLSearchParams(window.location.search);
const postId = params.get('post'); // ex: post-1773470906552-4223

async function loadPost(){
  try{
    const resp = await fetch(GAS_URL, {method:"POST", body: JSON.stringify({read:true})});
    const data = await resp.json();
    const posts = data || [];

    const post = posts.find(p => p.id === postId);
    const container = document.getElementById('postContainer');

    if(post){
      container.innerHTML = `
        <div class="card">
          <h1>${post.judul}</h1>
          ${post.ket ? `<p>${post.ket}</p>` : ""}
          <p>Author: <strong>${post.author}</strong></p>
          <p>Link: <a href="${post.link}" target="_blank">${post.link}</a></p>
          <p>Waktu: ${new Date(post.createdAt).toLocaleString('id-ID')}</p>
        </div>
      `;
    } else {
      container.innerHTML = "<p>Post tidak ditemukan.</p>";
    }

  } catch(e){
    console.error(e);
    document.getElementById('postContainer').innerHTML = "<p>Gagal ambil data dari server.</p>";
  }
}

loadPost();
</script>
</body>
</html>
