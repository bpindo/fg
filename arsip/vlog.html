<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Blog Viewer</title>

<style>

body{
font-family:system-ui;
background:#f2f4f8;
margin:0;
padding:12px;
}

.container{
max-width:640px;
margin:auto;
}

.container h1{
text-align:center;
}

.container h1{
text-align:center;
margin-bottom:20px;
}

ul{
list-style:none;
padding:0;
}

li{
background:#fff;
padding:12px;
margin-bottom:8px;
border-radius:8px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
transition:.2s;
}

li:hover{
background:#2563eb;
color:#fff;
}

.comment-count{
font-size:13px;
color:#6b7280;
}

.post-card{
background:#fff;
padding:16px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
margin-bottom:16px;
}

.comment-card{
background:#f9fafb;
border-radius:10px;
padding:10px;
margin-bottom:8px;
border:1px solid #e5e7eb;
}

.comment-reply{
border-left:2px solid #e5e7eb;
margin-left:16px;
padding-left:10px;
margin-top:6px;
}

.comment-author{
font-weight:600;
color:#2563eb;
}

.comment-text{
margin-top:2px;
color:#374151;
}

button{
margin-top:12px;
padding:10px 14px;
border:none;
border-radius:8px;
background:#ef4444;
color:#fff;
cursor:pointer;
font-weight:600;
}

.author-link{
font-weight:600;
cursor:pointer;
}

a{
color:#2563eb;
text-decoration:underline;
}

.author-link{
color:#2563eb;
font-weight:600;
cursor:pointer;
}

.author-link:hover{
text-decoration:underline;
}

.post-card h2{
margin-bottom:4px;
}

.auth-btn{
color:#2563eb;
cursor:pointer;
font-weight:600;
}

.auth-btn:hover{
text-decoration:underline;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.4);
display:flex;
align-items:center;
justify-content:center;
}

.modal-box{
background:#fff;
padding:20px;
border-radius:10px;
width:320px;
}

.modal-box input{
width:100%;
padding:8px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Mini Blog</h1>
<div id="authBar" style="text-align:center;margin-bottom:20px;"></div>
<div id="content"></div>
</div>

<script>

const GAS_URL="https://script.google.com/macros/s/AKfycbwzsIy_r8hsXjIH7nt2VgxETeM86kipahJCMPMLLAzgenyjWc-SrkxTRwI-uym1-Qws/exec";

let posts=[];


/* SLUG */

function slugify(text){
return text.toString().toLowerCase().trim().replace(/\s+/g,"-").replace(/[^\w\-]+/g,"");
}


/* HITUNG KOMENTAR */

function countAllComments(comments){
let count=0;

comments.forEach(c=>{
count+=1;

if(c.replies && c.replies.length>0){
count+=countAllComments(c.replies);
}
});

return count;
}


/* BUAT SLUG KOMENTAR */

function assignCommentSlug(post){

function loop(comments){

comments.forEach(c=>{

if(!c.slug){
const time=Date.now();
c.slug=`re-${slugify(post.author)}-${time}`;
}

if(c.replies){
loop(c.replies);
}

});

}

loop(post.comments);

}


/* RENDER KOMENTAR */

function renderComments(comments){

let html="";

comments.forEach(c=>{

html+=`

<div class="comment-card">

<div class="comment-author">@${c.author}</div>

<div class="comment-text">

<a onclick="openComment('${c.author}','${c.slug}')">
${c.text}
</a>

</div>

</div>

`;

if(c.replies && c.replies.length>0){

html+=`

<div class="comment-reply">
${renderComments(c.replies)}
</div>

`;

}

});

return html;

}


/* FETCH POSTS */

async function fetchPosts(){

try{

const resp=await fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({read:true})
});

const data=await resp.json();

posts=data || [];

posts.forEach(p=>{

p.slug=slugify(p.judul || "post");

if(!p.comments) p.comments=[];

assignCommentSlug(p);

});

render();

}

catch(err){

console.error(err);

document.getElementById("content").innerHTML="Gagal ambil data";

}

}


/* ROUTER */

function getRoute(){

const hash=window.location.hash.replace("#","");
const parts=hash.split("/").filter(Boolean);

if(parts.length===0){
return {type:"home"};
}

if(parts.length===1 && parts[0].startsWith("@")){
return{
type:"author",
author:parts[0].replace("@","")
};
}

if(parts.length===2 && parts[0].startsWith("@")){

if(parts[1].startsWith("re-")){
return{
type:"comment",
author:parts[0].replace("@",""),
slug:parts[1]
};
}

return{
type:"post",
author:parts[0].replace("@",""),
slug:parts[1]
};

}

return {type:"home"};

}


/* HOME */

function renderHome(){

let html="<ul>";

posts.forEach(p=>{

const commentCount=countAllComments(p.comments);

html+=`

<li onclick="openPost('${p.author}','${p.slug}')">

<span>${p.judul}</span>

<span class="comment-count">💬 ${commentCount}</span>

</li>

`;

});

html+="</ul>";

document.getElementById("content").innerHTML=html;

}


/* AUTHOR PAGE */

function renderAuthor(author){

const list=posts.filter(p=>slugify(p.author)===slugify(author));

let html=`<div class="post-card">

<h2>@${author}</h2>
<p>${list.length} Post</p>

</div>

<ul>`;

list.forEach(p=>{

html+=`

<li onclick="openPost('${p.author}','${p.slug}')">

<span>${p.judul}</span>

<span class="comment-count">💬 ${countAllComments(p.comments)}</span>

</li>

`;

});

html+="</ul>";
html+=`<button onclick="goHome()">Home</button>`;

document.getElementById("content").innerHTML=html;

}


/* POST PAGE */

function renderPost(author,slug){

const post=posts.find(p=>slugify(p.author)===slugify(author) && p.slug===slug);

if(!post){
document.getElementById("content").innerHTML="Post tidak ditemukan";
return;
}

let html=`

<div class="post-card">

<h2>${post.judul}</h2>

<p style="color:#6b7280;font-size:14px">

oleh 
<span class="author-link" onclick="openAuthor('${post.author}')">
@${post.author}
</span>

• ${countAllComments(post.comments)} komentar

</p>

<p>${post.ket || ""}</p>

${post.link ? `<p>Link: <a href="${post.link}" target="_blank">${post.link}</a></p>`:""}

<h3>Komentar (${countAllComments(post.comments)})</h3>

${renderComments(post.comments)}

<button onclick="goHome()">Home</button>

</div>

`;

document.getElementById("content").innerHTML=html;

}


/* HALAMAN KOMENTAR */

function renderComment(author,slug){

let found=null;
let parent=null;

posts.forEach(p=>{

function search(comments){

comments.forEach(c=>{

if(c.slug===slug){
found=c;
parent=p;
}

if(c.replies){
search(c.replies);
}

});

}

search(p.comments);

});

if(!found){

document.getElementById("content").innerHTML="Komentar tidak ditemukan";
return;

}

let html=`

<div class="post-card">

<h2>Komentar oleh @${found.author}</h2>

<p>${found.text}</p>

<p style="color:#6b7280">

Balasan dari post:

<span class="author-link"
onclick="openPost('${parent.author}','${parent.slug}')">

${parent.judul}

</span>

</p>

<button onclick="goHome()">Home</button>

</div>

`;

document.getElementById("content").innerHTML=html;

}


/* NAVIGATION */

function openPost(author,slug){
window.location.hash=`@${slugify(author)}/${slug}`;
}

function openAuthor(author){
window.location.hash=`@${slugify(author)}`;
}

function openComment(author,slug){
window.location.hash=`@${slugify(author)}/${slug}`;
}

function goHome(){
window.location.hash="";
}

/* AUTH SYSTEM */

function getUser(){
const cookie=document.cookie.split("; ").find(row=>row.startsWith("user="));
if(cookie){
return JSON.parse(decodeURIComponent(cookie.split("=")[1]));
}
return null;
}

function setUser(user){
document.cookie="user="+encodeURIComponent(JSON.stringify(user))+"; path=/";
}

function logout(){
document.cookie="user=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
renderAuth();
}

function renderAuth(){

const user=getUser();

if(!user){

document.getElementById("authBar").innerHTML=`
<span class="auth-btn" onclick="showLogin()">Login</span>
`;

}else{

document.getElementById("authBar").innerHTML=`
<span>@${user.username}</span>
 • 
<span class="auth-btn" onclick="logout()">Logout</span>
`;

}

}

function showLogin(){

document.body.insertAdjacentHTML("beforeend",`

<div class="modal" id="loginModal">

<div class="modal-box">

<h3>Login</h3>

<input id="loginUser" placeholder="Username">

<input id="loginKey" placeholder="Private Key">

<button onclick="doLogin()">Login</button>

<p style="margin-top:10px;">
Belum punya akun?
<span class="auth-btn" onclick="showRegister()">Daftar</span>
</p>

</div>
</div>

`);

}

function showRegister(){

document.getElementById("loginModal").remove();

document.body.insertAdjacentHTML("beforeend",`

<div class="modal" id="loginModal">

<div class="modal-box">

<h3>Register</h3>

<input id="regUser" placeholder="Username">

<button onclick="doRegister()">Daftar</button>

<p style="margin-top:10px;">
Private key akan dibuat otomatis
</p>

</div>
</div>

`);

}

function generateKey(){
return crypto.randomUUID().replace(/-/g,"");
}

async function doRegister(){

const username=document.getElementById("regUser").value.trim();

if(!username) return;

const privateKey=generateKey();
const publicKey=btoa(privateKey);

const resp=await fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({
register:true,
username:username,
publicKey:publicKey
})
});

const data=await resp.json();

if(data.success){

document.getElementById("loginModal").innerHTML=`

<div class="modal-box">

<h3>Registrasi Berhasil</h3>

<p>Simpan PRIVATE KEY ini:</p>

<textarea style="width:100%;height:60px">${privateKey}</textarea>

<p>Silakan login.</p>

<button onclick="closeModal()">OK</button>

</div>
`;

}

}

async function doLogin(){

const username=document.getElementById("loginUser").value.trim();
const privateKey=document.getElementById("loginKey").value.trim();

const publicKey=btoa(privateKey);

const resp=await fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({
login:true,
username:username,
publicKey:publicKey
})
});

const data=await resp.json();

if(data.success){

setUser({username});

closeModal();

renderAuth();

}else{

alert("Login gagal");

}

}

function closeModal(){
document.getElementById("loginModal").remove();
}

renderAuth();

/* RENDER */

function render(){

const route=getRoute();

if(route.type==="home") renderHome();
if(route.type==="author") renderAuthor(route.author);
if(route.type==="post") renderPost(route.author,route.slug);
if(route.type==="comment") renderComment(route.author,route.slug);

}


window.addEventListener("hashchange",render);


/* START */

fetchPosts();

</script>
</body>
</html>
