<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Viewer Post</title>
<style>
body{font-family:system-ui;background:#f4f4f4;margin:0;padding:12px}
.container{max-width:600px;margin:auto;background:#fff;padding:15px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
h2{color:#2563eb;margin-bottom:6px}
p{color:#374151;margin-bottom:8px}
a{color:#10b981;text-decoration:none}
</style>
</head>
<body>
<div class="container" id="post-container">
<h2>Memuat post...</h2>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwzsIy_r8hsXjIH7nt2VgxETeM86kipahJCMPMLLAzgenyjWc-SrkxTRwI-uym1-Qws/exec";

function getPostIdFromURL(){
  const params = new URLSearchParams(window.location.search);
  return params.get('post'); // misal post=post-1773470906552-4223
}

async function loadPost(){
  const container = document.getElementById('post-container');
  try{
    const resp = await fetch(GAS_URL, {method:'POST', body: JSON.stringify({read:true})});
    const data = await resp.json();

    if(!data || data.length === 0){
      container.innerHTML = "<p>Data kosong.</p>";
      return;
    }

    const postIdParam = getPostIdFromURL();

    // Cari post yang cocok dengan postId (jika ada)
    let post = data.find(p => p.id === postIdParam);

    // Jika tidak ada, ambil post pertama
    if(!post) post = data[0];

    container.innerHTML = `
      <h2>${post.judul}</h2>
      <p>${post.ket || ""}</p>
      <p><strong>Author:</strong> ${post.author || "Anonim"}</p>
      <p><a href="${post.link}" target="_blank">Buka Link</a></p>
      <p><em>Waktu: ${new Date(post.createdAt).toLocaleString()}</em></p>
    `;

  }catch(err){
    console.error(err);
    container.innerHTML = "<p>Gagal memuat data post.</p>";
  }
}

loadPost();
</script>
</body>
</html>
