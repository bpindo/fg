<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Viewer Post</title>
<style>
body{font-family:system-ui;background:#f2f4f8;margin:0;padding:12px}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#1f2937;margin-bottom:20px}
ul{list-style:none;padding:0}
li{
  background:#fff;
  padding:12px;
  margin-bottom:8px;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:.2s;
}
li:hover{background:#2563eb;color:#fff}
.comment-count{
  font-size:13px;
  color:#6b7280;
  display:flex;
  align-items:center;
  gap:4px;
}
.comment-count:hover{color:#fff}
.post-card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
button{margin-top:12px;padding:10px 14px;border:none;border-radius:8px;background:#ef4444;color:#fff;cursor:pointer;font-weight:600}
a{color:#2563eb;text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<h1>Mini Viewer Post</h1>
<div id="content"></div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwzsIy_r8hsXjIH7nt2VgxETeM86kipahJCMPMLLAzgenyjWc-SrkxTRwI-uym1-Qws/exec";
let posts = [];

// Fungsi membuat slug dari judul
function slugify(text){
  return text.toString().toLowerCase()
    .trim()
    .replace(/[\s]+/g,'-')
    .replace(/[^\w\-]+/g,'');
}

// Hitung semua komentar termasuk reply
function countAllComments(comments){
  let count = 0;
  comments.forEach(c=>{
    count += 1;
    if(c.replies && c.replies.length>0) count += countAllComments(c.replies);
  });
  return count;
}

// Fetch semua post
async function fetchPosts(){
  try{
    const resp = await fetch(GAS_URL, {method:"POST", body:JSON.stringify({read:true})});
    const data = await resp.json();
    posts = data || [];
    posts.forEach(p => {
      p.slug = slugify(p.judul || "post-" + Math.random());
      if(!p.comments) p.comments = [];
    });
    render();
  } catch(err){
    console.error(err);
    document.getElementById("content").innerHTML="<p>Gagal ambil data.</p>";
  }
}

// Render halaman sesuai hash
function render(){
  const hash = window.location.hash.replace('#','');
  if(hash){
    // Tampilkan detail post
    const post = posts.find(p=>p.slug===hash);
    if(post){
      document.getElementById("content").innerHTML = `
        <div class="post-card">
          <h2>${post.judul}</h2>
          ${post.ket?`<p>${post.ket}</p>`:""}
          ${post.link?`<p>Link: <a href="${post.link}" target="_blank">${post.link}</a></p>`:""}
          <button onclick="goBack()">Kembali</button>
        </div>
      `;
    } else {
      document.getElementById("content").innerHTML="<p>Post tidak ditemukan.</p><button onclick='goBack()'>Kembali</button>";
    }
  } else {
    // Tampilkan daftar post dengan jumlah komentar di kanan
    let html="<ul>";
    posts.forEach(p=>{
      const commentCount = countAllComments(p.comments);
      html+=`<li onclick="openPost('${p.slug}')">
        <span>${p.judul}</span>
        <span class="comment-count">💬 ${commentCount}</span>
      </li>`;
    });
    html+="</ul>";
    document.getElementById("content").innerHTML = html;
  }
}

// Fungsi buka post
function openPost(slug){
  window.location.hash = slug;
  render();
}

// Fungsi kembali ke daftar
function goBack(){
  window.location.hash="";
  render();
}

// Listen hash change (misal reload halaman dengan hash)
window.addEventListener("hashchange", render);

// Inisialisasi
fetchPosts();
</script>
</body>
</html>
